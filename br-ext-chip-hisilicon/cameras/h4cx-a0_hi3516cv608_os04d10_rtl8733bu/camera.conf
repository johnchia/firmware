# The H4 (H4CX-A0 on the board): a Hi3516CV608 module with an OS04D10 and an
# RTL8733BU on USB. Everything about the SoC, the flash layout and the
# software stack is hi3516cv608_raptor's; this is what is soldered around it.
# README.md says where each fact came from and what has run on the unit.
BR2_OPENIPC_CAMERA="h4cx-a0_hi3516cv608_os04d10_rtl8733bu"
BR2_OPENIPC_CAMERA_BASE="hi3516cv608_raptor"
BR2_OPENIPC_SNS_MODEL="os04d10"
BR2_PACKAGE_RTL8733BU_OPENIPC=y
BR2_PACKAGE_WIRELESS_TOOLS=y
BR2_PACKAGE_WPA_SUPPLICANT=y
BR2_PACKAGE_WPA_SUPPLICANT_AP_SUPPORT=y
BR2_PACKAGE_WPA_SUPPLICANT_CLI=y

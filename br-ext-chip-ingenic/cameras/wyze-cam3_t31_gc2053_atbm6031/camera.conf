# The Wyze Cam v3: a T31X with a GalaxyCore GC2053 and an AltoBeam ATBM6031 on
# SDIO, no Ethernet PHY, no serial header, an SD slot the bootloader can
# recover the whole chip from. Everything about the SoC, the uClibc userland,
# the bootloader build and the flash layout is t31_raptor's; this is what is
# soldered around it. README.md says where each fact came from and what has
# run on the unit.
BR2_OPENIPC_CAMERA="wyze-cam3_t31_gc2053_atbm6031"
BR2_OPENIPC_CAMERA_BASE="t31_raptor"
BR2_OPENIPC_SNS_MODEL="gc2053"
BR2_PACKAGE_ATBM60XX=y
BR2_PACKAGE_ATBM60XX_INTERFACE_SDIO=y
BR2_PACKAGE_ATBM60XX_MODEL_603X=y
BR2_PACKAGE_HOST_UBOOT_TOOLS_ENVIMAGE=y
BR2_PACKAGE_HOST_UBOOT_TOOLS_ENVIMAGE_SIZE="0x10000"
BR2_PACKAGE_HOST_UBOOT_TOOLS_ENVIMAGE_SOURCE="$(OPENIPC_CAMERA_DIR)/uboot.env.txt"
BR2_PACKAGE_INGENIC_UBOOT_GPIO_BUTTON_RESET="51"
BR2_PACKAGE_INGENIC_UBOOT_GPIO_MMC_CD="59"
BR2_PACKAGE_INGENIC_UBOOT_GPIO_MMC_POWER="48"
BR2_PACKAGE_INGENIC_UBOOT_GPIO_MMC_POWER_ACTIVE_LOW=y
BR2_PACKAGE_WIRELESS_TOOLS=y
BR2_PACKAGE_WPA_SUPPLICANT=y
BR2_PACKAGE_WPA_SUPPLICANT_AP_SUPPORT=y
BR2_PACKAGE_WPA_SUPPLICANT_CLI=y
BR2_PACKAGE_WPA_SUPPLICANT_PASSPHRASE=y

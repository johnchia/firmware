# Nightly images for this fork's four Raptor boards.
#
# WHY THIS IS NOT build.yml
#
# Upstream's build.yml gates preflight and select on
# `github.repository == 'OpenIPC/firmware'`, so its schedule deliberately does
# nothing here -- a clone must not spend its owner's Actions minutes on a
# ~96-board matrix unattended. That guard is right and is left alone. This
# workflow is the fork's own nightly, for the boards the fork adds, and it
# carries the same guard pointed at this repository.
#
# Keeping it in a separate file also keeps the merge surface at zero. Upstream
# revises its CI constantly; every conflict avoided here is one that would
# otherwise have to be resolved on a file whose logic is theirs.
#
# WHY A SCHEDULE AND NOT A PUSH TRIGGER
#
# Raptor is four SHA pins, not a moving ref, so an image is a pure function of
# this repository's HEAD. Building on every push would republish identical
# bytes for a README edit. Building nightly *if anything changed* -- a pin bump
# or any other commit -- publishes exactly when the image would differ, and
# publishes nothing on a quiet week. The comparison is against what the last
# nightly recorded in its own release notes, which is upstream's idea in
# build.yml's preflight; the pin list is compared as well so a bump is visible
# in the log rather than inferred from a sha.
name: raptor-nightly

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and publish even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: raptor-nightly
  cancel-in-progress: false

env:
  RELEASE_TAG: raptor-nightly

jobs:
  gate:
    name: Gate
    if: >-
      github.repository == 'johnchia/firmware' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      build_id:     ${{ steps.decide.outputs.build_id }}
      head_sha:     ${{ steps.decide.outputs.head_sha }}
      pins:         ${{ steps.decide.outputs.pins }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          HEAD=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          BUILD_ID="nightly-$(date -u +%Y%m%d)-${SHORT}"

          # The four Raptor pins plus the headers pin, as one line. Read from
          # the package rather than kept in step with it by hand.
          MK=general/package/raptor-streaming/raptor-streaming.mk
          PINS=$(sed -n 's/^RAPTOR_STREAMING\(_[A-Z]*\)\?_VERSION = \(.*\)$/\2/p' "$MK" \
                 | cut -c1-7 | paste -sd, -)

          NOTES=$(gh release view "$RELEASE_TAG" --json body -q .body 2>/dev/null || true)
          PREV_SHA=$(printf '%s\n' "$NOTES" | sed -n 's/^sha=//p'  | head -1)
          PREV_PINS=$(printf '%s\n' "$NOTES" | sed -n 's/^pins=//p' | head -1)

          if [ "$FORCE" = "true" ]; then
            echo "Build: forced by dispatch"
            BUILD=true
          elif [ "$PREV_SHA" != "$HEAD" ]; then
            echo "Build: HEAD moved ($PREV_SHA -> $HEAD)"
            BUILD=true
          elif [ "$PREV_PINS" != "$PINS" ]; then
            # Cannot normally happen without HEAD moving, since the pins live in
            # this repository. Checked anyway: if it ever fires, something
            # rewrote history under the release and the image really is stale.
            echo "Build: pins moved ($PREV_PINS -> $PINS)"
            BUILD=true
          else
            echo "Skip: HEAD $HEAD already published, pins unchanged ($PINS)"
            BUILD=false
          fi

          {
            echo "should_build=$BUILD"
            echo "build_id=$BUILD_ID"
            echo "head_sha=$HEAD"
            echo "pins=$PINS"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.board }}
    needs: gate
    if: needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [ssc377qe_raptor, ssc377d_raptor, ssc30kq_raptor, ssc333_sc3336_raptor,
                t31_raptor]
    env:
      BUILD_ID:  ${{ needs.gate.outputs.build_id }}
      BUILD_SHA: ${{ needs.gate.outputs.head_sha }}
      # Buildroot's default download directory is $(TOPDIR)/dl, and TOPDIR is
      # the Buildroot source tree -- output/buildroot-<BR_VER>/dl, a path that
      # moves every time the Makefile's BR_VER is bumped. Buildroot reads this
      # environment variable before it reads .config, specifically so a caller
      # can pin the directory; pinning it is what lets the cache step below
      # name a path that does not rot.
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: echo "CACHE_DATE=$(date +%m)" >> "$GITHUB_ENV"

      - name: ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: raptor-${{ matrix.board }}-${{ env.CACHE_DATE }}

      # Keyed per board rather than once for the matrix. The four jobs run in
      # parallel and would otherwise race to save one key: actions/cache takes
      # the first writer and the rest get a non-fatal conflict, so whichever
      # board finished first would decide what the next run finds. Per board it
      # is deterministic, and each entry holds only what that board fetches.
      - name: dl cache
        uses: actions/cache@v4
        with:
          path: dl
          key: raptor-dl-${{ matrix.board }}-${{ env.CACHE_DATE }}
          restore-keys: raptor-dl-${{ matrix.board }}-

      # The Raptor tarballs are named by commit sha, so a stale cache cannot
      # feed those an old revision -- but the image is not only Raptor. The
      # SigmaStar boards pull sigmastar-osdrv-sensors, which upstream pins to
      # HEAD, and a moving ref keeps a constant download filename. The delete
      # is by filename pattern rather than by package, so it covers any other
      # moving ref a board picks up later -- t31_raptor's ingenic-opensdk and
      # atbm60xx among them. The cache key is the
      # month and actions/cache only saves on a miss, so that tarball would be
      # frozen for weeks and the nightly would quietly ship old vendor drivers.
      # Same reasoning and same patterns as build.yml's own purge step.
      #
      # It runs unguarded on purpose. The `2>/dev/null || true` this used to
      # carry is what let the wrong directory go unnoticed: find printed
      # nothing because there was nothing at the path, and a purge that never
      # purged looked exactly like a purge with nothing to do.
      - name: Refresh moving-ref package downloads
        run: |
          set -eu
          mkdir -p "$BR2_DL_DIR"
          find "$BR2_DL_DIR" -type f -regextype posix-extended \
            -regex '.*[-.](HEAD|master|main|dist)\.tar\.(gz|bz2|xz)' \
            -print -delete

      - name: Build
        run: |
          set -eu
          mkdir -p /tmp/ccache
          ln -sfn /tmp/ccache "$HOME/.ccache"
          make BOARD=${{ matrix.board }} all

      # The bootloader is built by the defconfig -- BR2_TARGET_UBOOT on both
      # vendors now -- so this only assembles
      # what is already in images/. It is worth carrying:
      # a .tgz is a sysupgrade of a camera that already runs OpenIPC, while the
      # .bin is a whole-flash image for one that runs the factory firmware, or
      # whose flash is in an unknown state.
      #
      # The flash descriptor at 0x9000 is the placeholder every from-source
      # build writes, the same one OpenIPC's own published u-boot carries. To
      # keep a specific unit's proven bytes, pass SNI_REF=<dump of its mtd0> to
      # `make fullimage` locally instead.
      #
      # A target that does not build one gets the .tgz alone rather than
      # failing the board. ssc333_sc3336_raptor is that case: its only interface
      # the radio, and the credentials it joins a network with live in the
      # U-Boot environment a full image erases, so a whole-flash write there
      # produces a camera that has to be opened rather than reflashed.
      #
      # t31_raptor has the same shape and not the same consequence, which is
      # why it builds one. Its environment is erased by a full write too and it
      # is equally radio-only, but an unprovisioned Wyze v3 raises its own
      # access point and serves the setup portal (S41setup), and the pinned
      # bootloader can be driven from an SD card. A blanked unit there talks
      # its way back; a blanked ssc333 has to be opened.
      #
      # The condition reads the defconfig instead of naming boards, so a target
      # that gains a bootloader gains the image with it.
      - name: Full NOR image
        run: |
          set -eu
          cfg=$(ls br-ext-chip-*/configs/${{ matrix.board }}_defconfig)
          if grep -qE '^BR2_TARGET_UBOOT=y' "$cfg"; then
            make BOARD=${{ matrix.board }} fullimage
          else
            echo "no bootloader package in $cfg -- publishing the sysupgrade tarball only"
          fi

      - name: Checksums
        run: |
          cd output/images
          for f in openipc-*-nor-full.bin; do
            [ -e "$f" ] || continue
            md5sum "$f" > "$f.md5sum"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: raptor-${{ matrix.board }}
          if-no-files-found: error
          retention-days: 2
          path: |
            output/images/openipc.*.tgz
            output/images/openipc-*-nor-full.bin
            output/images/openipc-*-nor-full.bin.md5sum

  publish:
    name: Publish
    needs: [gate, build]
    # Publish whatever built. One board failing must not deny the other its
    # image, which is upstream's rule in build.yml for the same reason.
    if: always() && needs.gate.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dist
          merge-multiple: true

      - id: collect
        run: |
          set -eu
          count=$(find dist -type f 2>/dev/null | wc -l | tr -d '[:space:]')
          echo "Collected ${count} asset(s):"
          ls -la dist 2>/dev/null || true
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          # A matrix that went green must have produced artifacts; zero after
          # that is a failed download, not an empty build.
          if [ "${{ needs.build.result }}" = "success" ] && [ "$count" -eq 0 ]; then
            echo "::error::no assets although every board built"
            exit 1
          fi

      - name: Publish
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:   ${{ github.repository }}
          BUILD_ID:  ${{ needs.gate.outputs.build_id }}
          HEAD_SHA:  ${{ needs.gate.outputs.head_sha }}
          PINS:      ${{ needs.gate.outputs.pins }}
        run: |
          set -euo pipefail
          NOTES=$(printf '%s\n' \
            "Raptor nightly \`${BUILD_ID}\`" \
            "" \
            "\`.tgz\` upgrades a camera already running OpenIPC:" \
            "\`sysupgrade --archive=<file>\`. \`-nor-full.bin\` is a whole-flash" \
            "image including the bootloader, for one that is not -- carried for" \
            "the boards whose defconfig builds a bootloader." \
            "" \
            "sha=${HEAD_SHA}" \
            "pins=${PINS}")

          # The tag is rolling: the same release is rewritten each time, so a
          # download URL for "the current nightly" stays valid. --clobber
          # replaces an asset of the same name rather than failing on it.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Raptor nightly ${BUILD_ID}" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" --title "Raptor nightly ${BUILD_ID}" \
              --notes "$NOTES" --prerelease
          fi
          find dist -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber

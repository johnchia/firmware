# Level of messages on console
kernel.printk = 3 3 1 3
net.core.bpf_jit_enable=1

# A camera with both a wire and a radio on one subnet answers ARP for either
# of its addresses out of whichever interface gets there first -- on a cv608
# the wlan0 MAC answered for the wired address, so every packet to the wired
# address took the slow path and looked like a flaky link. arp_ignore=1 makes
# an interface answer only for an address it actually carries; arp_announce=2
# makes it source its own requests from that address. Both are no-ops on a
# camera with a single addressed interface, which is nearly all of them.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.default.arp_ignore=1
net.ipv4.conf.default.arp_announce=2

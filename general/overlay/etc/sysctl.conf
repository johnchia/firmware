# Level of messages on console
kernel.printk = 3 3 1 3
net.core.bpf_jit_enable=1

# A camera with both a wire and a radio on one subnet answers ARP for either
# of its addresses out of whichever interface gets there first -- on a cv608
# the wlan0 MAC answered for the wired address, so every packet to the wired
# address took the slow path and looked like a flaky link. arp_ignore=1 makes
# an interface answer only for an address it actually carries; arp_announce=2
# makes it source its own requests from that address. Both are no-ops on a
# camera with a single addressed interface, which is nearly all of them.
net.ipv4.conf.all.arp_ignore=1
net.ipv4.conf.all.arp_announce=2
net.ipv4.conf.default.arp_ignore=1
net.ipv4.conf.default.arp_announce=2

# Pulling the wire out of a camera that also has a radio does not remove the
# wire's routes: carrier loss leaves the interface UP, and by default the
# kernel keeps handing packets to it. Observed on a cv608 -- with the cable
# out, ip route get still chose eth0 for everything, so the radio sat there
# associated, addressed and carrying nothing. With this set the lookup skips a
# nexthop whose link is down, so the radio's routes take over the moment
# carrier drops and hand back the moment it returns. It is read per interface,
# so default is the one that matters: interfaces created later inherit it,
# and all on its own did nothing for an interface that already existed.
net.ipv4.conf.all.ignore_routes_with_linkdown=1
net.ipv4.conf.default.ignore_routes_with_linkdown=1

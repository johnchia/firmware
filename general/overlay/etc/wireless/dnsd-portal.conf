# Every name, on setup mode's network, is the camera.
#
# A lone `*` really is match-all in busybox dnsd -- table_lookup() special-cases
# a one-character name of '*' before it compares anything -- rather than a
# hostname that happens to contain an asterisk.
#
# This is half of what makes the portal captive: the phone resolves whichever
# connectivity-check host its vendor uses, reaches rhd, and is redirected. The
# other half is rhd answering every path with that redirect, so the list of
# check URLs never has to be written down anywhere.
*	172.16.0.1

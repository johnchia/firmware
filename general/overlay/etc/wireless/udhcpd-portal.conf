# The DHCP server for setup mode. Started by /etc/wireless/setup-mode, and
# only while the camera has no network of its own -- this must never be
# running on somebody's LAN.

# The pool starts at .2. The reference configuration this is modelled on
# starts at .1, which is the camera's own address: the first phone to join is
# offered the address it is trying to reach.
start		172.16.0.2
end		172.16.0.20
interface	wlan0
max_leases	19

# Short, because the only client is a phone that will be told to leave in a
# few minutes and should not hold an address afterwards.
option	lease	600
opt	subnet	255.255.255.0

# The camera answers DNS for every name (see dnsd-portal.conf) and is offered
# as the router as well. It routes nothing -- there is nowhere to route to --
# and that is the point: a default route with no internet behind it is what
# makes the phone run its connectivity check, and the redirect it gets back is
# what opens the setup sheet.
opt	router	172.16.0.1
opt	dns	172.16.0.1

lease_file	/run/udhcpd-portal.leases
pidfile		/run/udhcpd-portal.pid

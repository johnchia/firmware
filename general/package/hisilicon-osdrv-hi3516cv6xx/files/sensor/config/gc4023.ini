; gc4023 -- HiSilicon gen5 (hi3516cv6xx) sensor mode
;
; Values from the Hi3516CV610 PQTools config for this sensor. See the
; README beside this file for what each block is and where it came from.


[sensor]
Sensor_type = g_sns_gc4023_obj
DllFile     = libsns_gc4023.so
Mode        = WDR_MODE_NONE

[mode]
input_mode  = INPUT_MODE_MIPI
; One key, not three: the MIPI data type and the VB pixel format are both
; derived from it, and three keys can disagree.
raw_bitness = 12

[mipi]
; Board wiring, not a sensor property. -1 disables a lane.
lane_id          = 0|1|-1|-1
lane_divide_mode = 0            ; 0 = one 4-lane receiver, 1 = 2+2
data_rate        = 0            ; MIPI_DATA_RATE_X1

[i2c]
i2c_dev = 0

[isp_image]
Isp_FrameRate = 30
Isp_Bayer     = BAYER_RGGB
Isp_SnsMode   = 0

[vi_dev]
Input_mod  = VI_MODE_MIPI
Work_mod   = VI_WORK_MODE_1Multiplex
Mask_0     = 0xfff00000
Mask_1     = 0x0
Scan_mode  = VI_SCAN_PROGRESSIVE
Data_seq   = VI_DATA_SEQ_YVYU   ; YUV only; carried because the vendor sets it
InputDataType = 0               ; OT_VI_DATA_TYPE_RAW
DataRev    = FALSE
DataRate   = 0                  ; OT_DATA_RATE_X1

; Dead on a MIPI sensor. Carried because skipping them would be a guess
; about which fields the driver reads.
Vsync         = 0
VsyncNeg      = 0
Hsync         = 0
HsyncNeg      = 0
VsyncValid    = 1
VsyncValidNeg = 0
Timingblank_HsyncHfb   = 0
Timingblank_HsyncAct   = 0
Timingblank_HsyncHbb   = 0
Timingblank_VsyncVfb   = 0
Timingblank_VsyncVact  = 0
Timingblank_VsyncVbb   = 0
Timingblank_VsyncVbfb  = 0
Timingblank_VsyncVbact = 0
Timingblank_VsyncVbbb  = 0

; The sensor's output size. Also the MIPI receiver's img_rect and the ISP's
; wnd_rect; the vendor's config repeats it three times and they are equal.
DevRect_x = 0
DevRect_y = 0
DevRect_w = 2560
DevRect_h = 1440

; The CV608 die clocks its ISP at 148.5 MHz against the CV610's 198, so the
; vendor ships a separate config for it at a lower resolution. Only the two
; keys that change are repeated.
[vi_dev.hi3516cv608]
DevRect_w = 2304
DevRect_h = 1296

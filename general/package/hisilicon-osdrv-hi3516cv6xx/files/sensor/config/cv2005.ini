; cv2005 -- HiSilicon gen5 (hi3516cv6xx) sensor mode
;
; UNVERIFIED on a board. The Hi3516CV610 PQTools set has no config for this
; part, so the values come from the vendor app of a CV608 camera built
; around it (P23H), whose sample_comm tables for the CV2005 give:
; 1920x1080 at 30 fps, RAW10, MIPI device 0 on lanes 1 and 3, I2C bus 0.
;
; Lanes 1|3 are that board's wiring, not the part's: the vendor reference
; board uses 0|2 for device 0, and the P23H app hands 1|3 to every sensor
; it supports. If the picture is absent, suspect lane_id --
; /proc/umap/mipi_rx will report a detected width that does not match
; this file.
;
; Isp_Bayer is the one value the app does not settle, because it sets
; RGGB for every sensor it knows, whatever the part. If red and blue come
; out swapped, try BAYER_BGGR; a green or magenta cast means GRBG or GBRG.

[sensor]
Sensor_type = g_sns_cv2005_obj
DllFile     = libsns_cv2005.so
Mode        = WDR_MODE_NONE

[mode]
input_mode  = INPUT_MODE_MIPI
raw_bitness = 10

[mipi]
lane_id          = 1|3|-1|-1
lane_divide_mode = 0
data_rate        = 0

[i2c]
i2c_dev = 0

[isp_image]
Isp_FrameRate = 30
Isp_Bayer     = BAYER_RGGB
Isp_SnsMode   = 0

[vi_dev]
Input_mod  = VI_MODE_MIPI
Work_mod   = VI_WORK_MODE_1Multiplex
Mask_0     = 0xfff00000
Mask_1     = 0x0
Scan_mode  = VI_SCAN_PROGRESSIVE
Data_seq   = VI_DATA_SEQ_YVYU
InputDataType = 0
DataRev    = FALSE
DataRate   = 0

Vsync         = 0
VsyncNeg      = 0
Hsync         = 0
HsyncNeg      = 0
VsyncValid    = 1
VsyncValidNeg = 0
Timingblank_HsyncHfb   = 0
Timingblank_HsyncAct   = 0
Timingblank_HsyncHbb   = 0
Timingblank_VsyncVfb   = 0
Timingblank_VsyncVact  = 0
Timingblank_VsyncVbb   = 0
Timingblank_VsyncVbfb  = 0
Timingblank_VsyncVbact = 0
Timingblank_VsyncVbbb  = 0

; 1080p30 is inside the CV608 encoder's size table and well under its
; throughput, so no per-die override.
DevRect_x = 0
DevRect_y = 0
DevRect_w = 1920
DevRect_h = 1080

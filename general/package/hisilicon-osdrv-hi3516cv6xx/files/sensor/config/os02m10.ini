; os02m10 -- HiSilicon gen5 (hi3516cv6xx) sensor mode
;
; UNVERIFIED. This part is an OpenIPC addition rather than a vendor one:
; libsns_os02m10.so ships on the image but the Hi3516CV610 PQTools set has
; no config for it, so there is no vendor V5 file to restate. The values
; below come from the gen4 vendor INI for the same part plus this family's
; conventions, and the two that would show it are lane_id and Isp_Bayer.
;
; If the picture is absent, suspect lane_id -- /proc/umap/mipi_rx will
; report a detected width that does not match this file. If the picture is
; present with red and blue swapped, suspect Isp_Bayer.
;
; libsns_sp2308.so on this image exports g_sns_os02m10_obj -- it is this
; library under another name -- so a board configured for "sp2308" is
; served by this file too, and hisi_sensor.c finds the symbol by scanning.

[sensor]
Sensor_type = g_sns_os02m10_obj
DllFile     = libsns_os02m10.so
Mode        = WDR_MODE_NONE

[mode]
input_mode  = INPUT_MODE_MIPI
raw_bitness = 10

[mipi]
lane_id          = 0|1|-1|-1
lane_divide_mode = 0
data_rate        = 0

[i2c]
i2c_dev = 0

[isp_image]
Isp_FrameRate = 30
Isp_Bayer     = BAYER_BGGR
Isp_SnsMode   = 0

[vi_dev]
Input_mod  = VI_MODE_MIPI
Work_mod   = VI_WORK_MODE_1Multiplex
Mask_0     = 0xfff00000
Mask_1     = 0x0
Scan_mode  = VI_SCAN_PROGRESSIVE
Data_seq   = VI_DATA_SEQ_YVYU
InputDataType = 0
DataRev    = FALSE
DataRate   = 0

Vsync         = 0
VsyncNeg      = 0
Hsync         = 0
HsyncNeg      = 0
VsyncValid    = 1
VsyncValidNeg = 0
Timingblank_HsyncHfb   = 0
Timingblank_HsyncAct   = 0
Timingblank_HsyncHbb   = 0
Timingblank_VsyncVfb   = 0
Timingblank_VsyncVact  = 0
Timingblank_VsyncVbb   = 0
Timingblank_VsyncVbfb  = 0
Timingblank_VsyncVbact = 0
Timingblank_VsyncVbbb  = 0

; 1080p is within the CV608's ISP clock, so no per-die override.
DevRect_x = 0
DevRect_y = 0
DevRect_w = 1920
DevRect_h = 1080

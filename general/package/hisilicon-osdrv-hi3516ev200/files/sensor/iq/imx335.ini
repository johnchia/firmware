;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; raptor's IMX335 tuning for Hi3516EV200/EV300 (config/iq/hisilicon/imx335.ini).
;;
;; OpenIPC's imx335.ini (hisilicon-osdrv-hi3516ev200) with one night correction,
;; measured on an EV300 + IMX335 against majestic and an SSC377 + IMX335 on
;; 2026-09-02 (docs/hisilicon.md, "The night, second pass"):
;;
;;   [static_3dnr]        the imx307.ini ladder: twelve rungs to ISO 204800 instead
;;                        of nine ending at 12800, lighter spatial filtering and
;;                        motion thresholds that keep climbing with gain. It is the
;;                        ladder majestic runs on this sensor (through default.ini),
;;                        and on raptor it gave the cleanest picture of the night.
;;
;; A [static_saturation] AutoSat fade was carried here until 2026-09-03 and has
;; been dropped: libsns_imx335.so already hands the AWB library a calibrated
;; sixteen-column per-gain saturation table (AWB_SENSOR_DEFAULT_S.stAgcTbl,
;; 128 at unity down to 56 from 1024x, with its own WDR variant), and AutoSat
;; overrides that table rather than filling an empty one. Sony's numbers for
;; this module beat a curve fitted by eye on one night.
;;
;; Everything else is the shipped file. Installed as /usr/share/raptor/iq/imx335.ini,
;; which the HAL tries before /etc/sensors/iq/imx335.ini.
;;
;; [module_state] added 2026-09-03, taken verbatim from the shipped imx307.ini.
;;
;; imx307.ini is the one OpenIPC IQ file that carries the vendor's enable mask,
;; and it is the file this camera was running when it looked clean -- majestic
;; reached it through default.ini -> imx307.ini, and so did the A/B against this
;; file. The mask is why. Under it the live set is four sections: static_ae,
;; static_aerouteex, dynamic_gamma and static_3dnr (the last through
;; bDyanamic3DNR, the vendor's spelling; bStatic3DNR gates nothing). Every other
;; section in the file is documentation, and Bayer NR, sharpen, LDCI, DRC,
;; dehaze, DPC and saturation are left to libsns_imx335.so's own calibration.
;;
;; Without the mask a file means all of it (hal_isp.c, MS_ALL), so this file was
;; applying fourteen sections -- among them a [static_nr] that drives FineStr to
;; roughly 3x the firmware default while cutting CoringWgt (the JNLM coring
;; dead-zone) by ~24x at the ISO this camera sits at after dark, and that
;; overwrites two of Bayer NR's four ladders while CoarseStr and ChromaStr stay
;; the sensor library's. Transplanting imx307's [static_3dnr] on 2026-09-02 left
;; those thirteen other sections in place, which is why it did not close the gap:
;; both files already ran the same 3DNR ladder by the time it was measured.
;;
;; This is the single-variable follow-up: same file as that night, plus the mask.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;                                           module state                                               ;
;;
;; static_ae and static_aerouteex replaced 2026-09-03 with HiSilicon's own
;; imx335 product tuning (HiView-Centroid mod/mpp/{3516a,3516d}/src/scene_auto/
;; param/imx335_product_scene_1536p25_linear.ini -- the two are byte-identical).
;;
;; The route is the point. Every vendor-derived tuning caps integration at
;; 40 ms and spends the rest on gain -- imx307 at 40000/62564/38577, this
;; imx335 product file at 40000/62416/38485 over twelve nodes instead of ten.
;; OpenIPC's imx335 route was the outlier at 83000/15872/1240, and on this
;; camera it held integration at the full 50 ms frame period (measured: 6742
;; lines against imx307's 5400, exactly the 50000/40000 the two routes ask
;; for) with far less gain headroom.
;;
;; static_ae travels with it: the vendor writes route and exposure attrs
;; together under bStaticAE, so splitting them gives an inconsistent AE. This
;; drops OpenIPC's MaxHistOffset/HistRatioSlope -- absent from the vendor file,
;; so those fields now keep the library's own values -- and picks up
;; AERouteExValid, AERunInterval and AutoSysGainMax.
;;
;; AutoExpTimeMax = 40000 is carried as a comment only: raptor's
;; iq_sect_static_ae has no mapping for it, so it would be read and dropped.
;; It is the vendor's explicit exposure ceiling and is worth wiring up.
;;
;; NOT taken from that file, deliberately:
;;   [dynamic_threednr]  a different NRX generation (-en, -bwsf4, -kmsf4,
;;                       -dzsf5 999) that hisi_nrx_key does not parse, and its
;;                       15 rungs to ISO 200000 are no more reach than the
;;                       imx307 ladder already here (12 to 204800).
;;   [dynamic_bayernr]   masked off in the vendor file too (bDynamicBayernr=0),
;;                       and not a section name this loader applies.
;;   [dynamic_gamma]     7 tables reaching exposure 60,000,000 against the 3
;;                       here reaching 1,600,000, so this file's gamma ladder
;;                       does run out after dark -- but the curves look
;;                       different and the current ones were judged good, so
;;                       this is left for a separate test.
;;
;; [dynamic_gamma] replaced 2026-09-03 with the same vendor imx335 product
;; tuning the AE pair came from. Seven curves instead of three, and the ladder
;; reaches exposure 60,000,000 instead of 1,600,000.
;;
;; The OpenIPC ladder ran out after dark: at the exposure this camera reports
;; at night (~4.5e6) it was pinned at Table_2, its last curve, 2.8x past its
;; top threshold, so tone stopped adapting as the scene got darker. The vendor
;; ladder puts that same exposure mid-ladder with headroom above.
;;
;; Its LtoH/HtoL are also a proper hysteresis pair on one scale (LtoH just
;; above HtoL at each step). The OpenIPC pair was "3200, 6400, 25600" against
;; "400000, 800000, 1600000" -- two different scales, which is inert here only
;; because hal_dyn selects on HtoL alone and never reads LtoH.
;;
;; The tables are REFLOWED, values untouched. The vendor file writes each 1025
;; node curve as one physical line of up to 5059 bytes; the IQ reader's
;; HISI_IQ_LINE_MAX is 512 and it takes the first piece of an over-long line
;; and discards the rest, so the first attempt loaded 117 of 1025 nodes per
;; curve and hal_dyn correctly refused the lot ("module skipped; a partial user
;; curve would run on a stale tail"). Rewrapped here at 32 values per line,
;; the same width the OpenIPC files use -- max line 192 bytes. Every number in
;; the file was diffed before and after: none changed.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;module state;;;;;;;;;;;;;;

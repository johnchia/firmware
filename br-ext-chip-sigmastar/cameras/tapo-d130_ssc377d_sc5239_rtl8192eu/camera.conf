# The Tapo D130 (a TP-Link doorbell), rebuilt as a bench board: an SSC377D
# with a SmartSens SC5239 and an RTL8192EU on USB, the dongle power-gated on
# GPIO 42. Everything about the SoC and the software stack is
# ssc377d_raptor's; this is what is soldered around it. README.md says where
# each fact came from and what has run on the unit.
BR2_OPENIPC_CAMERA="tapo-d130_ssc377d_sc5239_rtl8192eu"
BR2_OPENIPC_CAMERA_BASE="ssc377d_raptor"
BR2_OPENIPC_SNS_MODEL="sc5239"
BR2_PACKAGE_HOST_UBOOT_TOOLS_ENVIMAGE=y
BR2_PACKAGE_HOST_UBOOT_TOOLS_ENVIMAGE_SIZE="0x10000"
BR2_PACKAGE_HOST_UBOOT_TOOLS_ENVIMAGE_SOURCE="$(OPENIPC_CAMERA_DIR)/uboot.env.txt"
BR2_PACKAGE_RTL8192EU_OPENIPC=y
BR2_PACKAGE_WIRELESS_TOOLS=y
BR2_PACKAGE_WPA_SUPPLICANT=y
BR2_PACKAGE_WPA_SUPPLICANT_AP_SUPPORT=y
BR2_PACKAGE_WPA_SUPPLICANT_CLI=y

# The KD110 (a KD110v2 unit): an SSC333 with a SmartSens SC3336 and an
# RTL8188FU on USB, nothing power-gated, so detection finds the radio and no
# environment is baked. Everything about the SoC and the software stack is
# ssc333_raptor's; this is what is soldered around it. README.md says where
# each fact came from and what has run on the unit.
BR2_OPENIPC_CAMERA="kd110_ssc333_sc3336_rtl8188fu"
BR2_OPENIPC_CAMERA_BASE="ssc333_raptor"
BR2_OPENIPC_SNS_MODEL="sc3336"
BR2_PACKAGE_RTL8188FU_OPENIPC=y
BR2_PACKAGE_WIRELESS_TOOLS=y
BR2_PACKAGE_WPA_SUPPLICANT=y
BR2_PACKAGE_WPA_SUPPLICANT_AP_SUPPORT=y
BR2_PACKAGE_WPA_SUPPLICANT_CLI=y
BR2_PACKAGE_WPA_SUPPLICANT_PASSPHRASE=y
